<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>BenchVIGER — Hardware Benchmark Database</title>

  <link rel="manifest" href="public/manifest.json">
  <link rel="stylesheet" href="src/css/main.css">
  <link rel="stylesheet" href="src/css/components.css">
  <link rel="stylesheet" href="src/css/charts.css">
  <link rel="stylesheet" href="src/css/mobile.css">
</head>

<body>

  <!-- Sticky Top Header -->
  <header class="app-header">
    <div class="brand-title">
      <svg class="icon-svg" style="width:24px; height:24px; fill:url(#brand-grad);" viewBox="0 0 24 24">
        <defs>
          <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        <path
          d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z" />
      </svg>
      BenchVIGER
      <span class="brand-badge">BETA</span>
    </div>

    <div class="header-actions">
      <a href="#/settings" class="icon-btn" title="Settings & Preferences" style="margin-right:6px;">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path
            d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
        </svg>
      </a>
      <a href="#/compare" class="icon-btn" title="Compare Selected Hardware">
        <svg class="icon-svg" viewBox="0 0 24 24">
          <path
            d="M10 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h5v-2H5V5h5V3zm9 0h-5v2h5v14h-5v2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 6h2v6h-2z" />
        </svg>
        <span id="compare-badge-count" class="badge-count" style="display:none;">0</span>
      </a>
    </div>
  </header>

  <!-- Horizontal Category Filter Bar -->
  <nav class="category-nav-bar">
    <button class="cat-chip active" data-cat="gpu">GPU</button>
    <button class="cat-chip" data-cat="cpu">CPU</button>
    <button class="cat-chip" data-cat="phones">Phones</button>
    <button class="cat-chip" data-cat="ram">RAM</button>
    <button class="cat-chip" data-cat="ssd">SSD</button>
    <button class="cat-chip" data-cat="psu">PSU</button>
  </nav>

  <!-- Main Dynamic SPA View Container -->
  <main id="app-content"></main>

  <!-- Floating Mobile Compare Bar -->
  <div id="floating-compare" class="floating-compare-bar" style="display:none;">
    <div style="font-size:0.85rem; font-weight:700;">
      <span id="floating-count" style="color:#60a5fa;">0</span> items queued
    </div>
    <a href="#/compare" class="compare-btn-primary" style="text-decoration:none;">
      Compare Specs →
    </a>
  </div>

  <!-- Bottom Navigation Bar (Mobile Native UI) -->
  <nav class="bottom-nav">
    <a href="#/gpu" class="nav-item active" data-nav="gpu">
      <svg viewBox="0 0 24 24">
        <path d="M4 6h16v12H4z" fill="none" />
        <path
          d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H4V6h16v12zM6 10h2v4H6zm4 0h2v4h-2zm4 0h2v4h-2z" />
      </svg>
      <span>GPUs</span>
    </a>
    <a href="#/category/cpu" class="nav-item" data-nav="cpu">
      <svg viewBox="0 0 24 24">
        <path
          d="M15 9H9v6h6V9zm-2 4h-2v-2h2v2zm8-2V9h-2V7c0-1.1-.9-2-2-2h-2V3h-2v2h-2V3H9v2H7c-1.1 0-2 .9-2 2v2H3v2h2v2H3v2h2v2c0 1.1.9 2 2 2h2v2h2v-2h2v2h2v-2h2c1.1 0 2-.9 2-2v-2h2v-2h-2v-2h2zm-4 6H7V7h10v10z" />
      </svg>
      <span>CPUs</span>
    </a>
    <a href="#/category/phones" class="nav-item" data-nav="phones">
      <svg viewBox="0 0 24 24">
        <path
          d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z" />
      </svg>
      <span>Phones</span>
    </a>
    <a href="#/compare" class="nav-item" data-nav="compare">
      <svg viewBox="0 0 24 24">
        <path
          d="M10 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h5v-2H5V5h5V3zm9 0h-5v2h5v14h-5v2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
      </svg>
      <span>Compare</span>
    </a>
    <a href="#/settings" class="nav-item" data-nav="settings">
      <svg viewBox="0 0 24 24">
        <path
          d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <!-- Module Entrypoint -->
  <script type="module" src="src/js/app.js"></script>

  <!-- Service Worker PWA Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('public/sw.js')
          .then(reg => console.log('SW Registered'))
          .catch(err => console.warn('SW Register failed', err));
      });
    }
  </script>
</body>

</html>
